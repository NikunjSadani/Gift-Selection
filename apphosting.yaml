runConfig:
  runtime: nodejs20
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  maxInstances: 10
  minInstances: 0

env:
  # ── Public (non-secret) ───────────────────────────────────────────────────
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  # ── Secrets (stored in Google Secret Manager, set per environment) ────────
  - variable: JWT_SECRET
    secret: JWT_SECRET
    availability:
      - RUNTIME

  - variable: ADMIN_JWT_SECRET
    secret: ADMIN_JWT_SECRET
    availability:
      - RUNTIME

  - variable: MSG91_AUTH_KEY
    secret: MSG91_AUTH_KEY
    availability:
      - RUNTIME

  - variable: MSG91_TEMPLATE_ID
    value: 699d295ba29962881e09d062
    availability:
      - RUNTIME

  - variable: MSG91_WHATSAPP_TEMPLATE
    value: ""
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    secret: FIREBASE_STORAGE_BUCKET
    availability:
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
    availability:
      - RUNTIME
